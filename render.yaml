# Render Blueprint (Infrastructure as Code) for the Atlas South API.
#
# Render reads this file when you create a Blueprint instance from the repo, so the service,
# its build/start commands, its health check and the full list of environment variables it
# needs are all provisioned from here rather than clicked together in the dashboard. That
# matters because three of the settings below are easy to get wrong by hand and each one
# fails in a way that looks like something else:
#
#   healthCheckPath  — must be /api/health, NOT /health. The health route is mounted under
#                      the /api prefix (apps/api/src/index.ts). Pointing Render at /health
#                      returns 404, Render concludes the service is down, and it restart-loops
#                      a service whose logs show a perfectly healthy boot.
#                      (docs/build/12-HOSTING-DEPLOYMENT.md §3 said /health — that was wrong.)
#
#   buildCommand     — must run `prisma migrate deploy`. Nothing else in the repo does. On a
#                      fresh Neon database the tables would simply not exist, and every
#                      request would fail at the query, not at startup.
#
#   DATABASE_URL     — Neon requires TLS. Append ?sslmode=require to the connection string,
#                      including the -pooler host for the pooled connection.
#
# The web frontend is NOT defined here: it is deployed by Vercel from the same repo, with
# vercel.json at the repo root (see README).
services:
  - type: web
    name: atlas-south-api
    runtime: node
    plan: free
    region: frankfurt # closest Render region to a London/South East user base
    branch: main
    # `npm ci` at the repo root installs the whole workspace and runs the root postinstall,
    # which builds packages/shared (the API imports it) and runs `prisma generate`.
    # `migrate deploy` runs last, applies only committed migrations, and is idempotent —
    # safe on every deploy, unlike `migrate dev`, which can prompt or reset.
    # `--include=dev` is required, not defensive: Render sets NODE_ENV=production, npm then
    # defaults `omit` to `dev`, and this repo compiles on the server — TypeScript and every
    # @types/* package are devDependencies. Without it the build fails with
    # "Could not find a declaration file for module 'express'", which points nowhere near the
    # real cause. Belt-and-braces with the repo's .npmrc (`include=dev`), which covers any
    # environment that doesn't use this file.
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/api && npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT and the app already reads it (apps/api/src/lib/env.ts coerces
      # process.env.PORT, defaulting to 9001 locally). Nothing to set.

      # ---- Set these yourself in the Render dashboard (sync: false = "prompt me") -------
      - key: DATABASE_URL
        sync: false # Neon pooled connection string + ?sslmode=require
      - key: CORS_ALLOWED_ORIGIN
        sync: false # the Vercel production origin, e.g. https://atlas-south-web.vercel.app
      - key: ADMIN_SEED_EMAIL
        sync: false # the address the first admin account is created against
      - key: RESEND_API_KEY
        sync: false # optional; enquiry emails are skipped (not failed) without it

      # ---- Generated by Render, never seen by anyone ------------------------------------
      # Each is a base64-encoded 256-bit value (~44 chars), comfortably over the 32-char
      # minimum that apps/api/src/lib/env.ts enforces via zod.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
