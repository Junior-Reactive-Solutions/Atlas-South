  <title>Atlas South company name (light, for dark backgrounds)</title>
  <desc>ATLAS SOUTH wordmark, all-white for use on navy/dark backgrounds (the footer),
    replacing a CSS brightness(0) invert() filter that worked but isn't how a brand mark
    should ship — a purpose-made light file is exact and doesn't depend on a filter
    surviving print/export/social-card contexts that don't run CSS.</desc>
