<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicon set (per favicon.io / web.dev/PWA guidance, Aug 2026). Every size below is
      rasterized from the same vector source, public/brand/symbol.svg (Chrome's own
      canvas + SVG renderer, no image library like sharp/imagemagick installed here),
      then favicon.ico is packaged from the 16/32 PNGs by
      apps/web/scripts/build-favicon-ico.mjs — no visual mismatch between any of them:
        - favicon.svg — listed first so every browser with SVG favicon support (all
          current Chromium/Firefox/Safari) uses the lossless vector directly.
        - favicon.ico (16/32, PNG-in-ICO) — fallback for browsers without SVG favicon
          support; still checked by some regardless of the <link> tags below.
        - Sized PNG <link rel="icon"> tags — belt-and-braces for engines that read these
          over the ICO.
        - apple-touch-icon (180×180, opaque white background — a transparent PNG here
          renders on a black iOS home-screen tile) — iOS/iPadOS home-screen icon.
        - site.webmanifest — Android "Add to Home Screen" / PWA install icon + theme color.
      Browsers cache favicons aggressively per-origin, sometimes past what cache headers
      say — after deploying a favicon change, a hard refresh (or clearing the site's
      cached data) may be needed to see it, independent of whether the deploy worked.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#002484" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      The home hero's poster frame (components/home/HeroCarousel.tsx) is the LCP element
      on the site's single most-visited page. Without this hint it only starts downloading
      once the router has resolved the Home route and React has rendered the <img>/<video>
      — this preload lets the browser fetch it in parallel with parsing the app bundle,
      so the hero has a real photograph on screen well before JS has finished loading.
    -->
    <link rel="preload" as="image" href="/hero-plant-room-inspection-poster.jpg" fetchpriority="high" />
    <title>Atlas South Technical Services</title>
  </head>
  <body>
    <!--
      Skip-navigation link — bypasses the repeated header/nav for keyboard and screen-reader
      users (WCAG 2.4.1 Bypass Blocks). Visually hidden until focused via sr-only; the
      matching anchor is id="main-content" on the <main> element in Layout.tsx.
      Tailwind's sr-only + focus:not-sr-only pattern is standard for this pattern.
    -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[9999] focus:rounded focus:bg-navy focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white focus:shadow-lg focus:outline-none"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
