<!doctype html>
<html lang="en-GB">
  <head>
    <!--
      Google Tag Manager — client-supplied container GTM-P84N846V (2026-09-10). Placed as
      high in <head> as possible per Google's own install instructions, so the container
      loads before the rest of the page. The CSP in vercel.json had to be widened to permit
      it: this inline bootstrap is allow-listed by its exact SHA-256 hash (script-src
      'sha256-...') rather than a blanket 'unsafe-inline', so this one known snippet runs
      but an unrelated injected inline script still would not — that's the whole reason
      the CSP had no 'unsafe-inline' before. googletagmanager.com is also added to
      script-src (GTM's own gtm.js loads from there), and analytics.google.com /
      google-analytics.com to connect-src, since a GA4 tag configured inside this
      container reports there — not to this domain, so connect-src 'self' alone would
      have silently blocked every hit once a tag was added.

      IF THIS SCRIPT'S TEXT EVER CHANGES, THE HASH IN vercel.json MUST BE RECOMPUTED —
      and NOT by hashing this file's raw bytes. The browser normalises CRLF to LF while
      parsing HTML before it hashes a script's content (per the HTML spec's input
      preprocessing step), and this file is CRLF. Hashing the raw CRLF source produced a
      value that looked right and silently failed in production — GTM never loaded, no
      build error, no visible symptom short of opening devtools. Compute the hash from
      apps/web/dist/index.html AFTER `npm run build`, with '\r\n' replaced by '\n' first,
      or simply load the deployed page and read the value Chrome's own CSP violation
      message reports — it names the exact hash it expected.
    -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-P84N846V');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicon set (per favicon.io / web.dev/PWA guidance, Aug 2026). Every size below is
      rasterized from the same vector source, public/brand/symbol.svg (Chrome's own
      canvas + SVG renderer, no image library like sharp/imagemagick installed here),
      then favicon.ico is packaged from the 16/32 PNGs by
      apps/web/scripts/build-favicon-ico.mjs — no visual mismatch between any of them:
        - favicon.svg — listed first so every browser with SVG favicon support (all
          current Chromium/Firefox/Safari) uses the lossless vector directly.
        - favicon.ico (16/32, PNG-in-ICO) — fallback for browsers without SVG favicon
          support; still checked by some regardless of the <link> tags below.
        - Sized PNG <link rel="icon"> tags — belt-and-braces for engines that read these
          over the ICO.
        - apple-touch-icon (180×180, opaque white background — a transparent PNG here
          renders on a black iOS home-screen tile) — iOS/iPadOS home-screen icon.
        - site.webmanifest — Android "Add to Home Screen" / PWA install icon + theme color.
      Browsers cache favicons aggressively per-origin, sometimes past what cache headers
      say — after deploying a favicon change, a hard refresh (or clearing the site's
      cached data) may be needed to see it, independent of whether the deploy worked.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#002484" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      The home hero's poster frame (components/home/HeroCarousel.tsx) is the LCP element
      on the site's single most-visited page. Without this hint it only starts downloading
      once the router has resolved the Home route and React has rendered the <img>/<video>
      — this preload lets the browser fetch it in parallel with parsing the app bundle,
      so the hero has a real photograph on screen well before JS has finished loading.
    -->
    <link rel="preload" as="image" href="/hero-plant-room-inspection-poster.jpg" fetchpriority="high" />
    <title>Atlas South Technical Services</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) — fallback for visitors with JS disabled.
         iframe src is allow-listed via frame-src in vercel.json's CSP. -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P84N846V"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!--
      Skip-navigation link — bypasses the repeated header/nav for keyboard and screen-reader
      users (WCAG 2.4.1 Bypass Blocks). Visually hidden until focused via sr-only; the
      matching anchor is id="main-content" on the <main> element in Layout.tsx.
      Tailwind's sr-only + focus:not-sr-only pattern is standard for this pattern.
    -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[9999] focus:rounded focus:bg-navy focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white focus:shadow-lg focus:outline-none"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
