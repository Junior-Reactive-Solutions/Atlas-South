<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicon set (per favicon.io / web.dev/PWA guidance, Aug 2026):
        - favicon.svg (the "AS" symbol mark, vector) — listed first so every browser that
          supports SVG favicons (all current Chromium/Firefox/Safari) uses it; it scales
          losslessly to any tab/pin/tile size and stays crisp on retina displays, unlike
          the raster set below.
        - favicon.ico (multi-size 16/32, PNG-in-ICO container) — fallback for browsers
          without SVG favicon support; built by apps/web/scripts/build-favicon-ico.mjs
          from favicon-16.png/favicon-32.png (still the old raster logo — regenerating
          these from the new vector symbol needs an image tool this environment doesn't
          have; low-impact since the SVG above is what actually renders everywhere that
          matters).
        - apple-touch-icon — iOS/iPadOS home-screen icon (unchanged, still the old mark;
          same regeneration gap as the ICO fallback above).
        - site.webmanifest — Android "Add to Home Screen" / PWA install icon + theme color.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#002484" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Atlas South Technical Services</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
