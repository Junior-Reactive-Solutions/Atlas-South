name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true # flips to required once the dependency tree is populated

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (this one is owned by Junior-Reactive-Solutions).
      # Running the free OSS gitleaks binary directly avoids that requirement entirely
      # — same scan, no license needed. See docs/build/11-GIT-GITHUB-WORKFLOW.md §6.
      - name: Scan for committed secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1
